<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Bot · 工作区总览</title>
<style>
:root{--ink:#18221f;--muted:#596a60;--page:#f4f6f2;--border:#dce2d9;--lime:#c5f68a;--rail:#13231c;color-scheme:light}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Inter,"PingFang SC","Microsoft Yahei",system-ui,sans-serif;background:var(--page);color:var(--ink)}button,input,select,textarea{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #798d55;outline-offset:3px}button:disabled{cursor:default;opacity:.45}button svg,span svg{flex-shrink:0}a{color:inherit}h1,h2,h3,p{margin:0}button{text-align:left}.shell{min-height:100vh;display:grid;grid-template-columns:206px minmax(0,1fr)}
aside{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;background:var(--rail);color:#dbe6dd;padding:26px 15px}.brand{display:flex;align-items:center;gap:10px;padding-left:8px;font-size:24px;color:white;font-weight:750;letter-spacing:-1.1px}.brandmark{background:var(--lime);border-radius:9px;color:var(--rail);font:italic 900 24px/35px Arial;width:35px;text-align:center}.railtitle,.eyebrow,.herotext>small,.railfoot>small{font:600 10px/1.5 "IBM Plex Mono",monospace;letter-spacing:.16em}.railtitle{margin:53px 12px 12px;color:#9bb0a1}
nav,.railfoot{display:grid;gap:5px}nav button,.railfoot a,.railfoot button{display:flex;align-items:center;gap:12px;padding:11px 13px;color:#c8d7ca;text-decoration:none;border-radius:7px;font-size:14px}nav button:hover,.railfoot a:hover,.railfoot button:hover{background:#273b2e}nav button.active{background:var(--lime);color:#17251a;font-weight:700}nav em{margin-left:auto;background:#394a38;color:#d7e9b2;font:12px monospace;border-radius:5px;padding:2px 7px}nav .active em{background:#40533a}.railfoot{margin-top:auto}.railfoot>small{border-top:1px solid #39483d;margin:16px 8px 0;padding-top:15px;color:#a6b9a9}
main{min-width:0}header{min-height:60px;padding:0 clamp(18px,3vw,46px);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:#fafbf8;color:var(--muted);font-size:13px}header span{margin:0 9px;color:#8f9b91}.env{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:12px;border:1px solid var(--border);border-radius:30px;padding:3px 11px}.env i,.event i{width:7px;height:7px;border-radius:50%;background:#579a4b}.body{max-width:1540px;margin:auto;padding:clamp(18px,2.6vw,38px)}.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,#182a20,#203629);color:white;border-radius:15px;padding:clamp(22px,3vw,43px);isolation:isolate}.hero:before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#63846644 .8px,transparent .9px);background-size:10px 10px;mask-image:linear-gradient(90deg,transparent 20%,black)}.herotext{position:relative;z-index:1;max-width:65%}.herotext>small{color:var(--lime);font-size:11px}.herotext h1,.pagehead h1{font-size:clamp(30px,3.3vw,52px);line-height:1.18;letter-spacing:-.045em}.herotext h1{margin:7px 0}.herotext p{color:#d4dfd3;font-size:14px}.signal{position:absolute;right:-2%;width:49%;height:100%;top:0;object-fit:contain;pointer-events:none}.lime,.dark,.soft,.picker button{display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:7px;padding:8px 15px;font-weight:650;font-size:14px}.lime{background:var(--lime);color:#1f3020;margin-top:18px}.dark,.picker button{background:var(--rail);color:white}.soft{background:#edf1ea}.lime:hover,.dark:hover,.soft:hover,.picker button:not(:disabled):hover{filter:brightness(.91)}
.stats,.columns,.cards{display:grid;gap:14px;margin-top:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat,.panel,.botcard,.picker>section{background:white;border:1px solid var(--border);border-radius:12px}.stat{position:relative;padding:16px 20px}.stat span{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.stat b{display:block;font:550 34px/1.3 "Inter",system-ui,sans-serif;letter-spacing:-.05em}.stat .jump{position:absolute;right:15px;bottom:18px;color:#829184}.stat:hover,.botcard:hover{border-color:#8ea282}.columns{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.panel{padding:6px 20px}.panelhead,.pagehead,.modalhead,.detailmeta,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.panelhead{padding:12px 0;border-bottom:1px solid var(--border);min-height:56px}h2{font-size:19px;line-height:1.45}button.textbtn,.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);border-radius:6px}.iconbtn{width:32px;height:32px}.textbtn{font-size:13px}.iconbtn:hover,.textbtn:hover,.taskrow:hover,.member:hover{background:#f4f7f0}
.taskrow,.member{display:flex;width:100%;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf0eb}.taskrow:last-child,.member:last-child{border:0}.grow{flex:1;min-width:0}.grow b,.grow small{display:block}.grow b,.botcard h2,.botcard p,.event span{overflow-wrap:anywhere}.grow small,.botcard small,.panelhead small,form small{font-size:12px;color:var(--muted)}.file,.avatar{display:grid;place-items:center;flex-shrink:0;width:38px;height:38px;border-radius:10px}.file{background:#f3f5ef;color:#536656}.tone0{background:#dceacb;color:#426238}.tone1{background:#f6e0c9;color:#815031}.tone2{background:#e2e2f2;color:#505582}.pill{flex-shrink:0;white-space:nowrap;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}.s0{background:#fff1ce;color:#805b12}.s1{background:#e6f2df;color:#3d6941}.s2{background:#f3e4e1;color:#853e35}footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}footer span,.search{display:flex;align-items:center;gap:6px}
.pagehead{margin:8px 0 25px}.pagehead h1{font-size:34px;margin-top:4px}.eyebrow{color:var(--muted)}.search{max-width:500px;border:1px solid var(--border);background:white;padding:7px 12px;border-radius:8px}.search input{width:100%;border:0;padding:3px;background:transparent}.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}.botcard{padding:20px;display:flex;align-items:flex-start;flex-direction:column;gap:7px}.botcard .avatar{margin-bottom:8px;width:44px;height:44px}.botcard p{color:var(--muted);margin:3px 0 12px}.botcard .soft{margin-top:auto}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--border)}.tabs button{border-radius:6px;padding:5px 11px;font-size:13px}.tabs button[aria-pressed=true]{background:var(--rail);color:white}.empty{padding:25px;color:var(--muted)}.event{display:flex;align-items:baseline;gap:14px;padding:15px 0;border-bottom:1px solid var(--border)}.event i{flex-shrink:0}.event time{white-space:nowrap;color:var(--muted);font:12px monospace}
dialog{color:var(--ink);border:1px solid var(--border);padding:24px;border-radius:14px;width:min(510px,94vw);max-height:90dvh;box-shadow:0 18px 60px #11241930}dialog::backdrop{background:#10241888}.modalhead{margin-bottom:18px}.modalhead h2{overflow-wrap:anywhere}dialog form{display:grid;gap:14px}form label{display:grid;gap:5px;font-size:13px;font-weight:650}form input,form select,textarea,.picker input[type=search]{width:100%;border:1px solid #bfcbc0;background:white;border-radius:6px;padding:8px 11px;font-weight:400;color:var(--ink)}textarea{min-height:85px;resize:vertical}.actions{justify-content:flex-end;margin-top:16px}.detailmeta{justify-content:flex-start}.detailmeta .pill{margin-left:auto}dialog h3{font-size:14px;margin:18px 0 6px}pre{font:14px/1.7 inherit;font-family:inherit;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--page);padding:12px;border-radius:7px;margin-top:6px}
.picker>section{max-width:820px;padding:24px}.picker h2{display:none}.picker section>div,.picker section>p{margin-bottom:15px}.picker label{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border);cursor:pointer}.picker label span span{display:block;color:var(--muted);font-size:13px}.picker input[type=checkbox]{accent-color:#34533a}.picker section>input{margin-bottom:12px}.mobile,.veil{display:none}
@media(min-width:1650px){.hero{padding-block:50px}}
@media(max-width:1000px){.shell{grid-template-columns:170px minmax(0,1fr)}aside{padding:20px 9px}.body{padding:18px}.columns{gap:10px;grid-template-columns:1.15fr 1fr}.panel{padding-inline:13px}.taskrow,.member{gap:8px}.stat{padding:13px}.file{display:none}}
@media(max-width:760px){.shell{display:block}aside{position:fixed;z-index:5;left:0;width:210px;transform:translateX(-105%)}aside.open{transform:none}.veil{display:block;position:fixed;inset:0;background:#0e22167d;z-index:4}.mobile{display:inline-flex}header{padding-inline:12px;min-height:50px}.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero{padding:21px}.herotext{max-width:79%}.herotext p{max-width:20em}.signal{right:-16%;opacity:.55}.stat b{font-size:28px}.body{padding:15px}.file{display:grid}.env{font-size:11px}.pagehead h1{font-size:26px}.event{flex-wrap:wrap;gap:8px}.event span{flex-basis:100%}.railtitle{margin-top:28px}}
</style></head><body><div id="root"></div><!--APP--></body></html>
